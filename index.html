<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hawajess Player</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #tap { position: absolute; inset: 0; z-index: 10; background: transparent; }
    #hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.55);
            color: #fff; font: 32px/76px -apple-system, sans-serif; text-align: center; }
    #tap.playing #hint { display: none; }
    .msg { color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding-top: 45%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="tap"><div id="hint">&#9654;</div></div>
  <script>
    function qp(n) { var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }
    var v = qp('v').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
    var start = parseInt(qp('start'), 10) || 0;
    var mute = qp('mute') === '1' ? 1 : 0;
    var player, ready = false;
    var tap = document.getElementById('tap');

    if (v.length !== 11) {
      document.body.innerHTML = '<p class="msg">رابط فيديو غير صالح</p>';
    } else {
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: v,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, controls: 0,
          fs: 0, disablekb: 1, iv_load_policy: 3, mute: mute, start: start, origin: location.origin
        },
        events: {
          onReady: function (e) { ready = true; e.target.playVideo(); },
          onStateChange: function (e) { if (e.data === 1) tap.classList.add('playing'); else tap.classList.remove('playing'); }
        }
      });
    }

    tap.addEventListener('click', function () {
      if (!ready) return;
      if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
    });
  </script>
</body>
</html>
