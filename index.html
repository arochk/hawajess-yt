<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hawajess Player</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    :root { --crop-top: 64px; --crop-bottom: 52px; }
    #wrap { position: absolute; inset: 0; overflow: hidden; }
    #player {
      position: absolute !important; left: 0 !important; width: 100% !important;
      top: calc(-1 * var(--crop-top)) !important;
      height: calc(100% + var(--crop-top) + var(--crop-bottom)) !important;
      border: 0;
    }
    #tap { position: absolute; inset: 0; z-index: 10; background: transparent; }
    #hint { position: absolute; top: 50%; left: 16px; transform: translateY(-50%);
            width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,.55);
            color: #fff; font: 26px/60px -apple-system, sans-serif; text-align: center; display: none; }
    #tap.show-hint #hint { display: block; }
    .msg { color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding-top: 45%; }
  </style>
</head>
<body>
  <div id="wrap"><div id="player"></div></div>
  <div id="tap"><div id="hint">&#128266;</div></div>
  <script>
    function qp(n) { var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }
    var v = qp('v').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
    var start = parseInt(qp('start'), 10) || 0;
    var player, ready = false, needUnmute = false;
    var tap = document.getElementById('tap');

    if (v.length !== 11) {
      document.body.innerHTML = '<p class="msg">رابط فيديو غير صالح</p>';
    } else {
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: v,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, controls: 0,
          fs: 0, disablekb: 1, iv_load_policy: 3, mute: 0, start: start, origin: location.origin
        },
        events: {
          onReady: function (e) {
            ready = true;
            e.target.playVideo();
            setTimeout(function () {
              var st = player.getPlayerState();
              if (st !== 1 && st !== 3) {
                needUnmute = true;
                player.mute();
                player.playVideo();
                tap.classList.add('show-hint');
              }
            }, 1200);
          },
          onStateChange: function (e) {
            if (e.data === 1 && !needUnmute) tap.classList.remove('show-hint');
          }
        }
      });
    }

    tap.addEventListener('click', function () {
      if (!ready) return;
      if (needUnmute) {
        player.unMute(); player.setVolume(100);
        needUnmute = false;
        tap.classList.remove('show-hint');
        if (player.getPlayerState() !== 1) player.playVideo();
        return;
      }
      if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
    });
  </script>
</body>
</html>
