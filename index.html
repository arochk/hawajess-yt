<!DOCTYPE html>
<!--
  Hawajess — YouTube proxy page for the in-app player.

  WHY THIS EXISTS:
  iOS WKWebView's LoadHTML(html, baseUrl) only *synthesizes* an origin; WKWebView can drop the HTTP Referer
  on the cross-origin iframe request (WebKit bug 169846), so YouTube may still reject the embed with
  "Error 153 — Video player configuration error". Loading a REAL https page (this file, served by GitHub
  Pages) performs an actual navigation, so a valid Referer/Origin is always sent → no 153.

  HOW THE APP USES IT:
  YouTubeWebViewPlayer calls  LoadURL("https://<you>.github.io/<repo>/?v=VIDEO_ID&start=SECONDS")
  and this page builds the official YouTube IFrame embed from the ?v= parameter.

  DEPLOY (GitHub Pages):
   1. Create a NEW public GitHub repo (e.g. "hawajess-yt") — keep your game repo private; only THIS page is public.
   2. Upload this file as  index.html  to that repo (root).
   3. Repo ▸ Settings ▸ Pages ▸ Source: "Deploy from a branch" ▸ Branch: main / (root) ▸ Save.
   4. After ~1 min your URL is:  https://<your-username>.github.io/hawajess-yt/
   5. Put that URL in YouTubeWebViewPlayer.ProxyUrl (in the C# file).

  TEST IT FIRST (in iPhone Safari):  open  https://<you>.github.io/hawajess-yt/?v=b8Osh5Y03N4
  If it plays → the app will play it too.
-->
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hawajess Player</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #root, iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .msg { color: #fff; font-family: -apple-system, sans-serif; text-align: center; padding-top: 45%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      function qp(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
      }
      // sanitise: a YouTube id is 11 chars of [A-Za-z0-9_-]
      var v = qp('v').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
      var start = parseInt(qp('start'), 10) || 0;
      var mute = qp('mute') === '1' ? 1 : 0;

      if (v.length !== 11) {
        document.getElementById('root').innerHTML = '<p class="msg">رابط فيديو غير صالح</p>';
        return;
      }

      var src = 'https://www.youtube-nocookie.com/embed/' + v
              + '?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&mute=' + mute
              + '&origin=' + encodeURIComponent(location.origin)
              + (start > 0 ? '&start=' + start : '');

      var f = document.createElement('iframe');
      f.src = src;
      f.allow = 'autoplay; encrypted-media; fullscreen';
      f.setAttribute('allowfullscreen', '');
      f.setAttribute('frameborder', '0');
      f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      document.getElementById('root').appendChild(f);
    })();
  </script>
</body>
</html>
